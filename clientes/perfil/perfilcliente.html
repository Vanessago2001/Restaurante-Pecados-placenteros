    <div class="container mt-5 pt-4">

        <div class="card shadow">
            <div class="card-header fw-bold">
                Información del Cliente
            </div>

            <div class="card-body">
                <div class="row g-3">

                    <!-- DATOS PERSONALES -->
                    <div class="col-md-6">
    <label class="form-label">Nombre completo</label>
    <input type="text" id="nombreCliente" class="form-control" value="Juan Pérez" disabled>
</div>

<div class="col-md-6">
    <label class="form-label">Correo electrónico</label>
    <input type="email" id="correoCliente" class="form-control" value="cliente@gmail.com" disabled>
</div>

<div class="col-md-6">
    <label class="form-label">Teléfono</label>
    <input type="text" id="telefonoCliente" class="form-control" value="3001234567" disabled>
</div>

<div class="col-md-6">
    <label class="form-label">Fecha de registro</label>
    <input type="text" id="fechaRegistro" class="form-control" value="10/01/2026" disabled>
</div>

<div class="col-md-6">
    <label class="form-label">Número de mesa</label>
    <input type="text" id="mesaCliente" class="form-control" value="Mesa 5" disabled>
</div>

<div class="mt-4 text-end">
    <button class="btn btn-outline-primary" id="btnEditar">
        Editar información
    </button>
</div>
<div class="col-12">
    <label class="form-label">Pedido del cliente</label>
    <div id="pedidoCliente" class="border rounded p-3 bg-light"></div>
</div>

                <div class="mt-4 text-end">
                    <button class="btn btn-outline-primary">Editar información</button>
                </div>
            </div>
        </div>
