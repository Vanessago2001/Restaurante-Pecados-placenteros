<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pecados Placenteros</title>
    <link rel="icon" type="image/png" href="/img/fonfo.png">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- ICONOS BOOTSTRAP -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="/estilo-global/estilosGlobal.css">
    <link rel="stylesheet" href="/estilo-global/estilo.css">


</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar color-primario px-2 sticky-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <!-- Logo -->
            <div class="d-flex align-items-center">
                <img src="/img/logo/logo.png" class="logo-navbar me-2" alt="Logo">
                <span class="titulo-nav fw-bold">PECADOS PLACENTEROS</span>
            </div>

            <!-- Botón menú -->
            <button class="btn text-white fs-3" id="btnMenu">☰</button>
        </div>
    </nav>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <ul>
            <li><a href="/clientes/PaginaPrincipal/clientes-Principal.html">PAGINA PRINCIPAL</a></li>
            <li><a href="../catalogo-de-clientes/index.html">CATALOGO</a></li>
            <li><a href="carrito.html">CARRITO</a></li>
            <li><a href="/clientes/perfil/perfilcliente.html">PERFIL</a></li>

        </ul>
    </aside>

    </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->

    <div class="container my-5">
        <h2 class="fw-bold mb-4">Tu pedido</h2>

        <div id="listaCarrito"></div>

        <div class="card p-4 mt-4 shadow-sm">
            <div class="d-flex justify-content-between fw-bold fs-5">
                <span>Total :</span>
                <span id="totalCarrito"></span>
            </div>

            <button class="color-primario btn-crear btn text-white mt-3 rounded-pill" data-bs-toggle="modal"
                data-bs-target="#modalPago">
                Confirmar pedido
            </button>
        </div>
    </div>

    <div class="modal fade" id="modalPago" tabindex="-1" aria-labelledby="modalPagoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="modalPagoLabel">Finalizar Pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formPago">
                        <div class="mb-3">
                            <label class="form-label">Nombre en la tarjeta</label>
                            <input type="text" class="form-control" placeholder="Juan Pérez" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Número de tarjeta</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
                                <input type="text" class="form-control" placeholder="0000 0000 0000 0000" maxlength="19"
                                    required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Expiración</label>
                                <input type="text" class="form-control" placeholder="MM/AA" maxlength="5" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">CVV</label>
                                <input type="password" class="form-control" placeholder="123" maxlength="3" required>
                            </div>
                        </div>
                        <hr>
                        <div class="d-grid gap-2">
                            <button type="submit"
                                class="color-primario btn-crear btn btn-lg text-white rounded-pill">Pagar Ahora</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastPago" class="toast align-items-center text-white bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    ¡Pago procesado con éxito! Tu pedido está en camino.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formPago').addEventListener('submit', function (e) {
            e.preventDefault();

            // Referencias a los elementos
            const modalElement = document.getElementById('modalPago');
            const modalInstancia = bootstrap.Modal.getInstance(modalElement);
            const toastElement = document.getElementById('toastPago');
            const toastBootstrap = bootstrap.Toast.getOrCreateInstance(toastElement);

            setTimeout(() => {
                // Cerrar el modal
                modalInstancia.hide();

                // Mostrar la notificación (Toast)
                toastBootstrap.show();

                // Limpiar el formulario y el carrito
                this.reset();
                btnPago.disabled = false;
            }, 2000);
        });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="/estilo-global/productos.js"></script>

    <script src="/estilo-global/menu.js"></script>

    <script src="../carrito/carrito.js"></script>

</body>

</html>
