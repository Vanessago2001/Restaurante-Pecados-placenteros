<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pecados Placenteros</title>
    <link rel="icon" type="image/png" href="/img/fonfo.png">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- ICONOS BOOTSTRAP -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../../estilo-global/estilosGlobal.css">
    <link rel="stylesheet" href="../../estilo-global/estilo.css">


</head>

<body>

    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center color-primario">
        <div class="row w-100">
            <!-- SECCIÓN LOGO -->
            <div class="col-md-6 d-flex align-items-center justify-content-center">
                <div class="text-center">
                    <a href="../inicioprincipal.html"></a>
                    <img src="../../img/logo/logoCompleto.png" alt="Pecados Placenteros Logo" class="img-fluid"
                        style="max-width: 600px;">
                        </a>
                </div>
            </div>

            <!-- SECCIÓN FORMULARIO -->
            <div class="col-md-6 d-flex align-items-center justify-content-center">
                <div class="card shadow-lg estilo-card-formulario">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <!-- ESPACIO INVISIBLE PARA (para el lado izquierdo) -->
                            <span></span>

                            <h5 class="fw-bold titulo-nav mb-0">
                                INICIAR SESIÓN
                            </h5>

                            <!-- BOTON CERRAR -->
                            <a href="../../clientes/PaginaPrincipal/clientes-Principal.html" class="btn-close btn-close-white"></a>
                        </div>

                        <form id="inicioSesion">
                            <!-- EMAIL -->
                            <label class="d-grid form-label text-white small">
                                Email
                                <input class="form-control" id="email" type="email" name="email" required />
                                <span class="error" id="err-email"></span>
                            </label>

                            <!-- CONTRASEÑA -->
                            <label class="d-grid form-label text-white small mb-4">
                                Contraseña
                                <input type="password" class="form-control" id="contraseña" name="contraseña" required
                                    minlength="2" />
                                <span class="error" id="err-contraseña"></span>
                            </label>

                            <!-- BOTON INICIAR SESIÓN -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary text-white">
                                    Iniciar sesión
                                </button>
                            </div>

                            <a href="../PaginaPrincipal/indexAdministrador.html"></a>

                            <!-- OLVIDAR CONTRA Y REGISTRO -->
                            <div class="text-center">
                                <a href="../olvido contraseña/index.html"
                                    class="text-white text-decoration-none small d-block mb-1">¿Olvidaste tu
                                    contraseña?</a>
                                <a href="../registro/index.html"
                                    class="text-info text-decoration-none small">Regístrate</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="./codigo.js"></script>

</body>

</html>
