<head>

    <title>Factura de Gastos</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../../estilo-global/estilosGlobal.css">
    <link rel="stylesheet" href="../../estilo-global/estilo.css">
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar color-primario px-2 sticky-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <!-- Logo -->
            <div class="d-flex align-items-center">
                <img src="../../img/platos/logo.png" class="logo-navbar me-2" alt="Logo">
                <span class="titulo-nav fw-bold">PECADOS PLACENTEROS</span>
            </div>

            <!-- Botón menú -->
            <button class="btn text-white fs-3" id="btnMenu">☰</button>
        </div>
    </nav>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <ul>
            <li><a href="../reservas/reservasE.html">RESERVAS</a></li>
            <li><a href="../factura-pos-gastos/factura-de-ventas.html">FACTURA POS</a></li>
            <li><a href="../factura-pos-gastos/factura-de-compra.html">GASTOS</a></li>
            <li><a href="../turnos-empleados/turnos.html">TURNOS</a></li>
            <li><a href="../perfiles/perfil-adm.html">PERFIL</a></li>
            <li><a href="../Informes/informes.html">INFORMES</a></li>
            <li><a href="../turnos-empleados/empleados.html">EMPLEADOS</a></li>
        </ul>
    </aside>

    <div class="container mt-5 pt-4">

        <!-- DATOS PROVEEDOR -->
        <div class="card mb-4">
            <div class="card-body">

                <h6 class="fw-bold mb-3">Factura de Compras</h6>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre del tercero</label>
                        <select class="form-select" id="nombretercero"></select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">NIT</label>
                        <select class="form-select" id="nittercero"></select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Fecha emisión</label>
                        <input type="date" class="form-control">
                    </div>
                </div>

            </div>
        </div>

        <!-- DETALLE -->
        <div class="card mb-4">
            <div class="card-body">

                <table class="table table-bordered text-center align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Descripción</th>
                            <th>Cantidad</th>
                            <th>Valor U</th>
                            <th>IVA</th>
                            <th>Total</th>
                            <th>Valor Promedio</th>
                            
                        </tr>
                     </thead>

<tbody id="tablaFacturadeCompra">
</tbody>

                </table>

<button class="btn btn-outline-primary btn-sm" id="agregarFila">
    + OTRO ITEM
</button>

            </div>
        </div>
    </div>
<div>
        <!-- TOTALES -->
        <div class="card">
            <div class="card-body">

                                <div class="row">
                    <div class="col-md-6">
<p>Subtotal: <strong id="subtotalGeneral">$0</strong></p>
<p>IVA: <strong id="ivaGeneral">$0</strong></p>
<p>Total: <strong id="totalGeneral">$0</strong></p>
                    </div>
                    <div class="col-md-6 text-end">
                        <label class="form-label">Días de vencimiento</label>
                        <select class="form-select mb-3">
                            <option>0</option>
                            <option>15</option>
                            <option>30</option>
                        </select>

                    </div>
                </div>

            </div>
        </div>
<div class="text-center ">
<button class="btn btn-light btn-crear p-3" id="btnGuardar">
  GUARDAR Y DESCARGAR
</button>
</div>
    </div>
        

<div class="modal fade" id="modalTercero" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Agregar nuevo tercero</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="text" id="nuevoNombre" class="form-control mb-3" placeholder="Nombre del tercero">
        <input type="number" id="nuevoNit" class="form-control" placeholder="NIT">
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="agregarTercero()">Guardar</button>
      </div>
    </div>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        
        <script src="../../estilo-global/productos.js"></script>
        
        <script src="../../estilo-global/menu.js"></script>
        <script src="../../estilo-global/terceros.js"></script>
        <script src="acomprar.js"></script>
</body>

</html>
