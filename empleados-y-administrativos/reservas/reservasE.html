    <link rel="icon" type="image/png" href="/img/fonfo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/estilo-global/estilo.css">
    <link rel="stylesheet" href="/estilo-global/estilosGlobal.css">
</head>

<body>

    <nav class="navbar color-primario px-2 fixed-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <!-- Logo -->
            <div class="d-flex align-items-center">
                <img src="/img/logo/logo.png" class="logo-navbar me-2" alt="Logo">
                <span class="titulo-nav fw-bold">PECADOS PLACENTEROS</span>
            </div>

            <!-- Botón menú -->
            <button class="btn text-white fs-3" id="btnMenu">☰</button>
        </div>
    </nav>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <ul>
            <li><a href="#">PEDIDOS</a></li>
            <li><a href="../reservas/reservasE.html">RESERVAS</a></li>
            <li><a href="../factura-pos-gastos/factura-de-ventas.html">FACTURA POS</a></li>
            <li><a href="../factura-pos-gastos/factura-de-compra.html">GASTOS</a></li>
            <li><a href="../turnos-empleados/turnos.html">TURNOS</a></li>
            <li><a href="#">INVENTARIO</a></li>
            <li><a href="../perfiles/perfil-adm.html">PERFIL</a></li>
            <li><a href="#">INFORMES</a></li>
            <li><a href="../turnos-empleados/empleados.html">EMPLEADOS</a></li>
        </ul>
    </aside>

    <div class="container my-4">

        <div class="header-reservas">
            <h4>Reservas</h4>
            <button class="btn btn-crear" data-bs-toggle="modal" data-bs-target="#modalReserva">
                <i class="bi bi-plus-circle"></i> Agregar reserva
            </button>
        </div>

        <div class="card p-3">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Personas</th>
                    </tr>
                </thead>
                <tbody id="tablaReservas">
                    <!-- Reservas aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="modalReserva" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Nueva reserva</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="formReserva">
                        <div class="mb-3">
                            <label class="form-label">Cliente</label>
                            <input type="text" class="form-control" id="cliente" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="fecha" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Hora</label>
                            <input type="time" class="form-control" id="hora" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Personas</label>
                            <input type="number" class="form-control" id="personas" min="1" required>
                        </div>

                        <button type="submit" class="btn btn-confirmar w-100">
                            Confirmar reserva
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>


    <script src="..//reservas/reservasE.js"></script>
    <script src="menu.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
