            <div class="col-md-3">
                <div class="card-informe text-center">
                    <span>Total Reservas</span>

            </div>

            <div class="col-md-3">

        </div>

        <div class="row g-4">

            <!-- RESERVAS POR DÍA -->
            <div class="col-lg-8 col-md-12">
                <div class="card-informe">
                    <h6 class="fw-bold mb-3">Reservas por Día</h6>

                    <div class="grafica-vertical">
                        <div class="columna h-60">
                            <div class="barra-vertical barra-reservas"></div>
                            <span>Lun</span>

                            <div class="barra-vertical barra-reservas"></div>

                        </div>

                            <div class="barra-vertical barra-reservas"></div>
                            <span>Mié</span>
                        </div>

                        <div class="columna h-55">
                            <div class="barra-vertical barra-reservas"></div>
                            <span>Jue</span>
                        </div>

                            <div class="barra-vertical barra-reservas"></div>

                        <p><span class="color color-pendiente"></span> Pendientes (25%)</p>
                        <p><span class="color color-cancelada"></span> Canceladas (15%)</p>
                    </div>
                </div>
