<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Informe de Turnos</title>
    <link rel="icon" type="image/png" href="/img/fonfo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <nav class="navbar bg-azul px-2 fixed-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <img src="../img/logo.png" class="logo me-2" alt="Logo">
                <span class="titulo-navbar">PECADOS PLACENTEROS</span>
            </div>

            <a href="informes.html">
                <i class="bi bi-box-arrow-left fs-1 text-white"></i>
            </a>
        </div>
    </nav>

    <div class="container my-5 ">
        <div class="mb-4">
            <h2 class="fw-bold">Informe de Turnos</h2>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card-informe text-center">
                    <span>Turnos Totales</span>
                    <h4 class="fw-bold mt-2">96</h4>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card-informe text-center">
                    <span>Turnos Completados</span>
                    <h4 class="fw-bold mt-2">82</h4>
                </div>
            </div>
        </div>

        <div class="row g-4">

            <div class="col-lg-8 col-md-12">
                <div class="card-informe">
                    <h6 class="fw-bold mb-3">Turnos por Día</h6>

                    <div class="grafica-vertical">
                        <div class="columna h-60">
                            <div class="barra-vertical barra-turnos"></div>
                            <span>Lun</span>
                        </div>
                        <div class="columna h-55">
                            <div class="barra-vertical barra-turnos"></div>
                            <span>Mar</span>
                        </div>
                        <div class="columna h-50">
                            <div class="barra-vertical barra-turnos"></div>
                            <span>Mié</span>
                        </div>
                        <div class="columna h-65">
                            <div class="barra-vertical barra-turnos"></div>
                            <span>Jue</span>
                        </div>
                        <div class="columna h-80">
                            <div class="barra-vertical barra-turnos"></div>
                            <span>Vie</span>
                        </div>
                        <div class="columna h-70">
                            <div class="barra-vertical barra-turnos"></div>
                            <span>Sáb</span>
                        </div>
                        <div class="columna h-45">
                            <div class="barra-vertical barra-turnos"></div>
                            <span>Dom</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-12">
                <div class="card-informe text-center">
                    <h6 class="fw-bold mb-3">Estado de Turnos</h6>

                    <div class="grafica-circular-turnos"></div>

                    <div class="mt-3 text-start">
                        <p><span class="color color-activo"></span> Activos (70%)</p>
                        <p><span class="color color-pendiente"></span> Pendientes (20%)</p>
                        <p><span class="color color-cancelado"></span> Cancelados (10%)</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
